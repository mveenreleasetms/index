<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReleaseTMS — Startpagina</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1e26;
    --card-hover: #222834;
    --text: #e8eaed;
    --muted: #9aa0ab;
    --accent: #4f8cff;
    --border: #2a303c;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --card-hover: #f0f4ff;
      --text: #1c2027;
      --muted: #5f6673;
      --accent: #2f6bdd;
      --border: #e2e6ec;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1.5rem;
  }
  header { max-width: 960px; margin: 0 auto 2rem; }
  .brand { display: flex; align-items: center; gap: 1rem; }
  .brand img {
    height: 64px; width: auto;
    border-radius: 8px;
  }
  h1 { font-size: 1.6rem; font-weight: 700; }
  header p { color: var(--muted); margin-top: .3rem; }
  #week { margin-top: 1.5rem; }
  #week h2 {
    font-size: .85rem; text-transform: uppercase;
    letter-spacing: .06em; color: var(--muted);
    margin-bottom: .8rem;
  }
  .group {
    max-width: 960px; margin: 0 auto 2rem;
  }
  .group h2 {
    font-size: .85rem; text-transform: uppercase;
    letter-spacing: .06em; color: var(--muted);
    margin-bottom: .8rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1.25rem;
  }
  a.card {
    display: flex; align-items: flex-start; gap: .9rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    text-decoration: none;
    color: var(--text);
    transition: background .15s, transform .15s;
  }
  a.card:hover { background: var(--card-hover); transform: translateY(-2px); }
  .icon {
    font-size: 1.6rem; line-height: 1;
    width: 48px; height: 48px; flex: 0 0 48px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
  }
  .card .info { min-width: 0; }
  .card .name { font-weight: 600; font-size: 1.05rem; }
  .card .desc {
    color: var(--muted); font-size: .9rem;
    margin-top: .3rem;
    display: block;
    line-height: 1.45;
    white-space: normal;
    overflow: visible;
    text-overflow: unset;
  }
  .hidden { display: none; }
  .week-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .week-item {
    display: flex;
    align-items: center;
    gap: .6rem;
    padding: .4rem .8rem;
    border-radius: 999px;
    background: var(--bg);
    border: 1px solid var(--border);
    font-size: .95rem;
  }
  .week-item.celebrate-today { border-color: var(--accent); }
  .week-item .when { color: var(--muted); font-size: .85rem; }
  #leave { margin-top: 1.5rem; }
  .leave-card {
    display: flex; align-items: flex-start; gap: .9rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
  }
  .leave-card .icon {
    font-size: 1.6rem; line-height: 1;
    width: 48px; height: 48px; flex: 0 0 48px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
  }
  .leave-card .info { min-width: 0; }
  .leave-card .name { font-weight: 600; font-size: 1.05rem; }
  .leave-card .name { display: block; }
  .leave-card .rows { display: block; margin-top: .4rem; }
  .leave-row {
    color: var(--muted);
    font-size: .9rem;
    line-height: 1.5;
  }
  .leave-row b { color: var(--text); font-weight: 600; }
  .leave-row + .leave-row::before { content: ", "; }
  #week .empty {
    color: var(--muted); font-size: .9rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.25rem;
  }
  footer {
    max-width: 960px; margin: 3rem auto 0;
    color: var(--muted); font-size: .8rem;
    text-align: center;
  }
  #celebrate-layer {
    position: fixed;
    inset: 0;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    overflow: hidden;
    z-index: 9999;
  }
  @keyframes celebrate-fall {
    0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0.6; }
  }
  .celebrate-piece {
    position: absolute;
    top: -5vh;
    font-size: 1.5rem;
    animation: celebrate-fall linear forwards;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <img src="Logo-2011-RTMS MKB Draft.jpg" alt="ReleaseTMS logo">
    <h1>ReleaseTMS startpagina</h1>
  </div>
  <p>Alle interne apps op één plek. Klik op een kaart.</p>
  <div id="week"></div>
  <div id="leave"></div>
</header>

<div id="groups"></div>

<footer>Dit zijn interne apps en alleen toegankelijk voor medewerkers vanuit kantoor of via VPN.</footer>

<script>
  const VERSION = "v1.3.0";
  const RELEASED_AT = "2026-10-14 07:23";

  // ============================================================
  // CONFIG: pas deze lijst aan om apps toe te voegen of te wijzigen.
  // Nieuwe app erbij? Kopieer een blokje en vul in. Klaar.
  // ============================================================
  const APPS = [
    {
      group: "Applicatie (live)",
      items: [
        {
          name: "Verlof RTMS",
          url: "https://verlofrtms20260925.osc-fr1.scalingo.io/login",
          desc: "Alles rondom verlof aanvragen, beoordelen en overzichten",
          icon: "🏖️"
        },
        {
          name: "Pinpas Bonnen",
          url: "https://bonnenlijstrtms20260925.osc-fr1.scalingo.io",
          desc: "Kosten gemaakt met een RTMS pinpas; geen btw factuur beschikbaar",
          icon: "🧾"
        }
      ]
    },
    {
      group: "SharePoint",
      items: [
       {
          name: "Overzicht klanten en verantwoordelijken",
          url: "https://releasetmscom.sharepoint.com/:x:/g/IQCfcPSvlx4eSpocH44ocb-iAQr1-FCUFeoNP4CT5_psRcg?e=2idnJr",
          desc: "Klantenoverzicht",
          icon: "📁"
        },
        {
          name: "AM & SM samen binnen ReleaseTMS",
          url: "https://releasetmscom.sharepoint.com/:b:/g/IQASTLJB5DL8Sb0vgd4ZJyZXAWeH0PR_RbY0v78Wzko8GwM?e=tAGnup",
          desc: "AM&SM",
          icon: "📁"
        },
        {
          name: "Urenlijsten Werkstudenten",
          url: "https://releasetmscom.sharepoint.com/:x:/g/IQDW6SNpCeMxTK_2A3cVnqBRAS-f03q5UujrktJHTUfKAwI?e=6B5wil",
          desc: "Urenlijst WS",
          icon: "📁"
        },
        {
          name: "Teamgids",
          url: "https://releasetmscom.sharepoint.com/:b:/g/IQBl_e6vQpk6QIZDuwb2dBBbAT4nmADNoviaWFAgfqGy_UY?e=PurJd3",
          desc: "Teamgids",
          icon: "📁"
        },
      ]
    },
    {
      group: "Test applicaties (niet operationeel)",
      items: [
        {
          name: "CRM RTMS",
          url: "https://crmrtms.osc-fr1.scalingo.io/",
          desc: "Testomgeving CRM",
          icon: "\ud83e\uddea"
        }
      ]
    }
    // Nieuwe groep of app? Voeg hier een nieuw object toe met group + items.
  ];
  // ============================================================

  const groupsEl = document.getElementById("groups");

  // ============================================================
  // CONFIG: jarig of jubileum? Vul hier de datums handmatig in.
  // verjaardag: vul "geboortedatum" in (volledige datum, bv. "1990-03-14").
  //   De leeftijd wordt NIET getoond, alleen dat iemand jarig is.
  // jubileum: vul "inDienstSinds" in (volledige datum). Het aantal jaar
  //   in dienst wordt automatisch berekend.
  // Voorbeelden:
  //   { naam: "Piet Jansen", type: "verjaardag", geboortedatum: "1990-03-14" },
  //   { naam: "Kim de Vries", type: "jubileum", inDienstSinds: "2020-03-17" }
  // ============================================================
  const EVENTS = [
    { naam: "Aleksandra", type: "verjaardag", geboortedatum: "1981-05-29" },
    { naam: "Bobbie", type: "verjaardag", geboortedatum: "1982-03-24" },
    { naam: "Chris", type: "verjaardag", geboortedatum: "1975-06-27" },
    { naam: "Genesis", type: "verjaardag", geboortedatum: "1990-04-18" },
    { naam: "Leo", type: "verjaardag", geboortedatum: "1969-12-23" },
    { naam: "Michel", type: "verjaardag", geboortedatum: "1968-05-11" },
    { naam: "Lena", type: "verjaardag", geboortedatum: "1996-04-29" },
    { naam: "Erik Jan", type: "verjaardag", geboortedatum: "1965-05-26" },
    { naam: "Mike", type: "verjaardag", geboortedatum: "1964-04-03" },
    { naam: "Tycho", type: "verjaardag", geboortedatum: "2004-10-13" },
    { naam: "Michiel", type: "verjaardag", geboortedatum: "1990-03-14" },
    { naam: "Harvey", type: "verjaardag", geboortedatum: "2001-03-23" },
    { naam: "Anouk", type: "verjaardag", geboortedatum: "2002-07-12" },
    { naam: "Nina", type: "verjaardag", geboortedatum: "2001-08-16" },
    { naam: "Nina", type: "verjaardag", geboortedatum: "2001-08-16" },
    { naam: "Lisa", type: "verjaardag", geboortedatum: "2003-08-31" },
    { naam: "Anne", type: "verjaardag", geboortedatum: "1990-03-14" },
    // { naam: "Test verjaardage", type: "verjaardag", geboortedatum: "1990-10-10" },
    { naam: "Aleksandra", type: "jubileum", inDienstSinds: "2014-09-22" },
    { naam: "Bobbie", type: "jubileum", inDienstSinds: "2010-09-20" },
    { naam: "Chris", type: "jubileum", inDienstSinds: "2024-10-01" },
    { naam: "Genesis", type: "jubileum", inDienstSinds: "2020-10-12" },
    { naam: "Leo", type: "jubileum", inDienstSinds: "2023-01-16" },
    { naam: "Michel", type: "jubileum", inDienstSinds: "2017-01-30" },
    { naam: "Lena", type: "jubileum", inDienstSinds: "2023-12-04" },
    { naam: "Harvey", type: "jubileum", inDienstSinds: "2020-03-17" },
    // { naam: "Test in dienst", type: "jubileum", inDienstSinds: "2020-10-09" }
  ];
  // ============================================================

  const DAY_MS = 24 * 60 * 60 * 1000;
  const DAY_NAMES = ["zondag", "maandag", "dinsdag", "woensdag", "donderdag", "vrijdag", "zaterdag"];

  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const weekday = (today.getDay() + 6) % 7; // 0 = maandag
  const monday = new Date(today.getTime() - weekday * DAY_MS);
  const nextMonday = new Date(monday.getTime() + 7 * DAY_MS);

  function eventDate(ev) {
    const source = ev.type === "jubileum" ? ev.inDienstSinds : ev.geboortedatum;
    const [y, m, d] = source.split("-").map(Number);
    return new Date(today.getFullYear(), m - 1, d);
  }

  function yearsInService(ev) {
    const [y, m, d] = ev.inDienstSinds.split("-").map(Number);
    const start = new Date(y, m - 1, d);
    const anniversary = new Date(today.getFullYear(), m - 1, d);
    return anniversary.getFullYear() - start.getFullYear();
  }

  const upcoming = EVENTS
    .map((ev) => ({ ...ev, date: eventDate(ev) }))
    .filter((ev) => ev.date >= today && ev.date < nextMonday)
    .sort((a, b) => a.date - b.date);

  const weekEl = document.getElementById("week");

  if (upcoming.length > 0) {
    const weekTitle = document.createElement("h2");
    weekTitle.textContent = "Deze week";
    weekEl.appendChild(weekTitle);
    const card = document.createElement("div");
    card.className = "week-card";
    upcoming.forEach((ev) => {
      const item = document.createElement("span");
      item.className = "week-item" + (ev.date.getTime() === today.getTime() ? " celebrate-today" : "");
      const icon = document.createElement("span");
      icon.textContent = ev.type === "jubileum" ? "🎉" : "🎂";
      const label = document.createElement("span");
      label.textContent = ev.naam + (ev.type === "jubileum" ? " — " + yearsInService(ev) + " jaar in dienst" : " — jarig");
      const when = document.createElement("span");
      when.className = "when";
      when.textContent = ev.date.getTime() === today.getTime() ? "vandaag" : DAY_NAMES[ev.date.getDay()];
      item.appendChild(icon);
      item.appendChild(label);
      item.appendChild(when);
      card.appendChild(item);
    });
    weekEl.appendChild(card);
  }

  const celebrateToday = upcoming.filter((ev) => ev.date.getTime() === today.getTime());
  const celebrateKey = "celebrate-seen-" + today.toISOString().slice(0, 10);
  if (celebrateToday.length > 0 && !localStorage.getItem(celebrateKey)) {
    try { localStorage.setItem(celebrateKey, "1"); } catch (e) {}
    const layer = document.createElement("div");
    layer.id = "celebrate-layer";
    document.body.appendChild(layer);

    const EMOJIS = celebrateToday.some((ev) => ev.type === "jubileum")
      ? ["\ud83c\udf89", "\ud83e\udd73", "\ud83c\udf8a", "\u2728", "\ud83c\udf81"]
      : ["\ud83c\udf82", "\ud83e\udd73", "\ud83c\udf89", "\u2728", "\ud83c\udf70"];

    for (let i = 0; i < 40; i++) {
      const piece = document.createElement("span");
      piece.className = "celebrate-piece";
      piece.textContent = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
      piece.style.left = Math.random() * 100 + "vw";
      piece.style.animationDuration = 3 + Math.random() * 4 + "s";
      piece.style.animationDelay = Math.random() * 2 + "s";
      piece.style.fontSize = 1 + Math.random() * 1.5 + "rem";
      layer.appendChild(piece);
    }
  }

  // ============================================================
  // VERLOF: wie zijn er de komende 5 werkdagen vrij?
  // Gegevens komen live uit de Verlof-app (token-beveiligd endpoint).
  // Token aanpassen? HIERonder vervangen. Endpoint uit? Dan verdwijnt
  // dit overzichtje geruisloos (er staat dan 'niet beschikbaar').
  // ============================================================
  const LEAVE_API =
    "https://verlofrtms20260925.osc-fr1.scalingo.io/api/leave/upcoming?token=eRJ-d8c1qW9T_LJXq8aDJ9OdYRxK_pqqIScXALUV6r8";
  const leaveEl = document.getElementById("leave");
  const DAY_ABBR = ["zo", "ma", "di", "wo", "do", "vr", "za"];
  function fmtDate(iso) {
    const d = new Date(iso + "T12:00:00");
    return DAY_ABBR[d.getDay()] + " " + d.getDate() + " " +
      d.toLocaleDateString("nl-NL", { month: "short" }).replace(".", "");
  }
  function periodeTekst(v) {
    if (v.van === v.tot) return fmtDate(v.van);
    return fmtDate(v.van) + " t/m " + fmtDate(v.tot);
  }
  fetch(LEAVE_API)
    .then((r) => (r.ok ? r.json() : Promise.reject(r.status)))
    .then((data) => {
      const personen = data.personen || [];
      if (personen.length === 0) return; // niets te melden: kaart weglaten
      const card = document.createElement("div");
      card.className = "leave-card";
      const icon = document.createElement("span");
      icon.className = "icon";
      icon.textContent = "\ud83c\udfd6\ufe0f";
      const info = document.createElement("span");
      info.className = "info";
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = "Geplande vrije dagen";
      info.appendChild(name);
      const rows = document.createElement("span");
      rows.className = "rows";
      personen.forEach((p) => {
        p.vakanties.forEach((v) => {
          const row = document.createElement("span");
          row.className = "leave-row";
          let tekst = periodeTekst(v);
          if (v.halve_dagen && v.halve_dagen.length > 0) {
            const delen = v.halve_dagen.map((h) => h.dagdeel).join("/");
            tekst += " \u2013 alleen " + delen;
          }
          const b = document.createElement("b");
          b.textContent = p.voornaam;
          row.appendChild(b);
          row.appendChild(document.createTextNode(" (" + tekst + ")"));
          rows.appendChild(row);
        });
      });
      info.appendChild(rows);
      card.appendChild(icon);
      card.appendChild(info);
      leaveEl.appendChild(card);
    })
    .catch(() => {
      // Endpoint onbereikbaar: niets tonen.
    });

  APPS.forEach((group, gi) => {
    const section = document.createElement("section");
    section.className = "group";
    section.dataset.group = gi;

    const h2 = document.createElement("h2");
    h2.textContent = group.group;
    section.appendChild(h2);

    const grid = document.createElement("div");
    grid.className = "grid";

    group.items.forEach((app) => {
      const a = document.createElement("a");
      a.className = "card";
      a.href = app.url;
      a.target = "_blank";
      a.rel = "noopener";
      a.dataset.search = (app.name + " " + app.desc).toLowerCase();

      const icon = document.createElement("span");
      icon.className = "icon";
      icon.textContent = app.icon;

      const info = document.createElement("span");
      info.className = "info";
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = app.name;
      const desc = document.createElement("span");
      desc.className = "desc";
      desc.textContent = app.desc;
      info.appendChild(name);
      info.appendChild(desc);

      a.appendChild(icon);
      a.appendChild(info);
      grid.appendChild(a);
    });

    section.appendChild(grid);
    groupsEl.appendChild(section);
  });

  const footerEl = document.querySelector("footer");
  const versionEl = document.createElement("p");
  versionEl.textContent = "Versie " + VERSION + " — live gegaan op " + RELEASED_AT;
  footerEl.appendChild(versionEl);

</script>

</body>
</html>
