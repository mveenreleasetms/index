root /app;

# ============================================================
# IP-FILTER: alleen toegestane bronnen mogen de pagina zien.
# Iedereen anders krijgt een 403 Forbidden-pagina.
# Nieuw IP toevoegen? Nog een "allow"-regel toevoegen.
# Wijziging ongedaan maken? "deny all" weghalen (niet aan te raden).
# ============================================================

allow 185.89.153.117;   # Vaste IP-adres kantoor
# allow 10.8.0.0/24;   # Voorbeeld: VPN-bereik, verwijder het # als je die hebt
deny  all;

# Standaard afhandeling van de startpagina-bestanden
location / {
  try_files $uri $uri/ /index.html =404;
}
